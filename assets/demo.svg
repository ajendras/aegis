<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Aegis Flow — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Aegis Flow — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#22c55e">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 2.20s steps(62) 0.60s forwards" fill="#e5e7eb">composer create-project aegis-flow/aegis-flow &amp;&amp; cd aegis-flow</text>
<text x="50" y="100" class="l" style="animation:show .01s 3.10s forwards" fill="#94a3b8">Installing dependencies... done</text>
<text x="50" y="126" class="l" style="animation:show .01s 3.32s forwards" fill="#94a3b8">Generating default config and encryption seed... done</text>
<text x="50" y="152" class="l" style="animation:show .01s 3.54s forwards" fill="#94a3b8">Project ready at aegis-flow/</text>
<text x="28" y="204" class="l" style="animation:show .01s 4.11s forwards"><tspan fill="#22c55e">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 4.11s forwards,type 1.40s steps(31) 4.11s forwards" fill="#e5e7eb">php -S localhost:8080 -t public</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.81s forwards" fill="#94a3b8">PHP 8.2 development server started at http://localhost:8080</text>
<text x="50" y="256" class="l" style="animation:show .01s 6.03s forwards" fill="#94a3b8">Control panel available • WebSocket hub listening on ws://localhost:8081</text>
<text x="28" y="308" class="l" style="animation:show .01s 6.60s forwards"><tspan fill="#22c55e">❯</tspan></text><text x="50" y="308" class="l ty" style="animation:show .01s 6.60s forwards,type 2.20s steps(68) 6.60s forwards" fill="#e5e7eb">php examples/agent-simulator.php --platform=windows --id=win-test-01</text>
<text x="50" y="334" class="l" style="animation:show .01s 9.10s forwards" fill="#94a3b8">Agent connected as win-test-01</text>
<text x="50" y="360" class="l" style="animation:show .01s 9.32s forwards" fill="#94a3b8">Received command screenshot → captured and sent back</text>
<text x="50" y="386" class="l" style="animation:show .01s 9.54s forwards" fill="#94a3b8">Automation &apos;daily-backup&apos; executed successfully</text>
<text x="28" y="438" class="l" style="animation:show .01s 10.11s forwards"><tspan fill="#22c55e">❯</tspan></text><text x="50" y="438" class="l ty" style="animation:show .01s 10.11s forwards,type 2.20s steps(77) 10.11s forwards" fill="#e5e7eb">curl -X POST http://localhost:8080/api/automate -d &apos;goal=Take screenshot of …</text>
<text x="50" y="464" class="l" style="animation:show .01s 12.61s forwards" fill="#94a3b8">AI parsed goal into 3-step sequence</text>
<text x="50" y="490" class="l" style="animation:show .01s 12.83s forwards" fill="#94a3b8">Dispatched to 2 Android agents</text>
<text x="50" y="516" class="l" style="animation:show .01s 13.05s forwards" fill="#94a3b8">2 screenshots saved to storage/reports/</text>
<g class="l" style="animation:show .01s 13.27s forwards"><text x="28" y="542" fill="#22c55e">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
